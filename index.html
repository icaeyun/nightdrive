<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nightdrive</title>
  <meta name="description" content="A cinematic night drive — coastal road, infinite lights, metropolitan horizon.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading veil -->
  <div class="loading-veil"><div class="loading-dot"></div></div>

  <!-- Layer 1 — CityScape Three.js canvas (injected by CityScape class) -->
  <div id="city-mount"></div>

  <!-- Layer 5 — Infinite Lights road (center corridor, radial-masked) -->
  <div id="road-bg"></div>

  <!-- Layer 22 — Speed effect 2D overlay (injected by SpeedLayer) -->
  <div id="speed-layer-mount"></div>

  <!-- Layer 24 — Horizon top gradient -->
  <div class="horizon-overlay"></div>

  <!-- Layer 25 — Text trail -->
  <div id="text-trail-wrap"></div>

  <!-- Layer 27 — Vignette -->
  <div class="vignette"></div>

  <!-- Layer 30 — UI -->
  <div class="ui-layer">

    <nav class="nav">
      <div class="nav__logo">nd</div>
      <div class="nav__links">
        <a href="saved.html" class="nav__link">saved</a>
      </div>
    </nav>

    <div class="hero">
      <div class="hero__sub">coastal route &nbsp;—&nbsp; night corridor</div>
      <div class="hero__actions">
        <button id="music-btn" class="btn-engine">start engine</button>
      </div>
    </div>

    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="moonlit">Moonlit Coast</button>
      <button class="mode-btn"        data-mode="metropolis">Metropolis Glow</button>
      <button class="mode-btn"        data-mode="cyber">Cyber Harbor</button>
      <button class="mode-btn"        data-mode="midnight">After Midnight</button>
    </div>

    <div class="bottom-bar">
      <span>— 120 km/h</span>
      <span id="mode-label">Moonlit Coast</span>
      <span>35.2°N · coastal route</span>
    </div>

  </div>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>
  <span class="sr-only">nightdrive</span>

  <!-- InfiniteLights stack (provides global THREE + POSTPROCESSING) -->
  <script src="references/infinite-lights-demo/js/three.min.js"></script>
  <script src="references/infinite-lights-demo/js/postprocessing.min.js"></script>
  <script src="references/infinite-lights-demo/js/InfiniteLights.js"></script>
  <script src="references/infinite-lights-demo/js/Distortions.js"></script>
  <!-- App scripts -->
  <script src="js/audio.js"></script>
  <script src="js/texttrail.js"></script>
  <script src="js/cityscape.js"></script>
  <script src="js/speedeffect.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
